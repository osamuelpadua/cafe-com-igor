name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 10 */3 * *'  # a cada 3 dias, às 10h UTC
  workflow_dispatch:         # permite rodar manualmente pelo GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://kkzpxmjdihyffyqgyqok.supabase.co/rest/v1/leads?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtrenB4bWpkaWh5ZmZ5cWd5cW9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NjI4OTgsImV4cCI6MjA5MzEzODg5OH0.jcdZZH07hH7wAORGmLZneP-WnUy3WjN2J-xgRHyjqXU" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtrenB4bWpkaWh5ZmZ5cWd5cW9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NjI4OTgsImV4cCI6MjA5MzEzODg5OH0.jcdZZH07hH7wAORGmLZneP-WnUy3WjN2J-xgRHyjqXU")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Aviso: resposta inesperada do Supabase ($STATUS)"
            exit 1
          fi
          echo "Supabase ativo."
